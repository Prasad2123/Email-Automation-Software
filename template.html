<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      color: #333333;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid #eaeaea;
      border-radius: 8px;
      padding: 24px;
    }
    .header {
      border-bottom: 2px solid #f05a28;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }
    .header h2 {
      margin: 0;
      color: #2c3e50;
    }
    .content {
      font-size: 15px;
      color: #444444;
    }
    .footer {
      margin-top: 24px;
      padding-top: 12px;
      border-top: 1px solid #eeeeee;
      font-size: 12px;
      color: #888888;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Greetings from Naree Foundation</h2>
    </div>
    <div class="content">
      <p>Dear <strong>{{ name }}</strong>,</p>
      <p>{{ message }}</p>
      <p>Thank you for your continuous support and engagement.</p>
    </div>
    <div class="footer">
      <p>&copy; Naree Foundation | Automated Outreach</p>
    </div>
  </div>
</body>
</html>
